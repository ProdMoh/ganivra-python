name: Feature request
description: Suggest a provider, API or capability for the SDK
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to measure?
      description: For example, a provider or API the SDK doesn't capture automatically yet.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
