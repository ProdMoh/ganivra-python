name: Release

# Push a tag such as v0.6.2 to publish that version to PyPI.
# PyPI must list this repository and workflow as a trusted publisher.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          module=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('ganivra/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$version" != "$module" ]; then
            echo "Tag $GITHUB_REF_NAME, pyproject $version and __version__ $module must match"; exit 1
          fi
      - run: python -m pip install -e ".[test]" build twine
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
